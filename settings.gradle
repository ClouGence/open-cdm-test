rootProject.name = 'open-cdm-test'

def openCdmBackend = file(providers.gradleProperty('openCdmBackendDir')
    .getOrElse('../open-cdm-copy-1/backend'))
if (!openCdmBackend.isDirectory()) {
    throw new GradleException("Missing open-cdm backend: ${openCdmBackend}")
}

includeBuild(openCdmBackend)
